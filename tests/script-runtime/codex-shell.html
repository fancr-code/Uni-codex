<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Codex runtime contract shell</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px system-ui, sans-serif; }
      main { min-height: 100vh; display: flex; flex-direction: column; padding: 24px; }
      [data-testid="conversation-turns"] { flex: 1; min-height: 360px; }
      form { border: 1px solid #bbb; border-radius: 12px; padding: 12px; }
      textarea { display: block; width: 100%; min-height: 80px; margin: 10px 0; }
      .composer-footer { display: flex; justify-content: flex-end; }
      .justify-end { display: flex; flex: 1; justify-content: flex-end; gap: 8px; }
      .flex-1 { display: flex; flex: 1; justify-content: flex-end; gap: 8px; min-width: 0; }
    </style>
  </head>
  <body>
    <main data-testid="thread-content">
      <section data-testid="conversation-turns" data-thread-find-target="conversation" data-conversation-id="thread-one">
        <article data-message-author-role="assistant">
          <p>这是用于验证正式监控脚本渲染与数值更新的完整助手回复内容。</p>
          <button aria-label="Copy" type="button">Copy</button>
        </article>
      </section>
      <form data-testid="composer">
        <textarea aria-label="消息"></textarea>
        <div class="composer-footer">
          <div class="justify-end">
            <div class="flex-1"><button data-testid="model" type="button">模型</button></div>
            <button data-testid="attachment" type="button">附件</button>
            <button data-testid="send" type="submit">发送</button>
          </div>
        </div>
      </form>
    </main>
    <script>
      window.__CODEX_TOKEN_USAGE_SCRIPT_TEST__ = true;
      const conversationSurface = document.querySelector('[data-testid="conversation-turns"]');
      const activeThread = document.createElement('div');
      activeThread.hidden = true;
      activeThread.setAttribute('data-app-action-sidebar-thread-active', 'true');
      activeThread.setAttribute('data-app-action-sidebar-thread-id', 'thread-one');
      document.body.append(activeThread);

      window.__codexTestContextState = {
        conversationId: 'thread-one',
        usedTokens: 2400,
        contextWindow: 12000,
      };
      window.__codexRuntimeFixture = {
        setConversation(conversationId, usedTokens, contextWindow = 12000) {
          conversationSurface.dataset.conversationId = conversationId;
          activeThread.setAttribute('data-app-action-sidebar-thread-id', conversationId);
          window.__codexTestContextState = { conversationId, usedTokens, contextWindow };
          history.replaceState({}, '', `/index.html?thread=${conversationId}`);
        },
      };
    </script>
  </body>
</html>
